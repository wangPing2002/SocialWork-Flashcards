name: Build Android APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify 2497-card content and review ledger
        run: python3 scripts/verify_repository.py

      - name: Verify V3.0.0 case, search and taxonomy integration
        run: python3 scripts/verify_v30_integrated.py

      - name: Verify enriched case provenance, length and 176 original Q/A hashes
        run: python3 scripts/verify_case_enrichment_v30.py

      - name: Verify V3.1 standalone 437 module and staged Z00-Z08 boundaries
        run: python3 scripts/verify_v31_integrated.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Java source grammar and mock exam subject isolation
        run: |
          javac -d /tmp scripts/SyntaxCheck.java
          java -cp /tmp SyntaxCheck app/src/main/java/com/seu/socialworkcards/*.java
          python3 scripts/test_mock_exam_scope.py
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Gradle environment
        run: gradle --version
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Inspect debug APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 5

      - name: Rename debug APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SocialWork-Flashcards-dev-${GITHUB_SHA::7}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: socialwork-flashcards-dev-${{ github.sha }}
          path: SocialWork-Flashcards-dev-*.apk
          if-no-files-found: error
